<div class="game-container">
  @if (game$ | async; as state) {
    @if (state.game; as game) {
      <div class="game-found">
        @for (team of game.teams; track trackTeam($index, team)) {
          <div
            class="team-score-row"
            [style.background]="team.color"
            [style.--team-contrast]="getContrastColor(team.color)"
            [style.--team-contrast-inverse]="getInverseContrastColor(team.color)"
          >
            <span class="team-name">{{ team.name || 'Equipe sans nom' }}</span>
            <ion-button
              class="score-action score-action-minus"
              fill="outline"
              size="small"
              (click)="changeScore(game, $index, -1)"
              >-</ion-button
            >
            <span class="score">{{ team.score }}</span>
            <ion-button
              class="score-action score-action-plus"
              fill="solid"
              size="small"
              (click)="changeScore(game, $index, 1)"
              >+</ion-button
            >
          </div>
        }
      </div>
    } @else {
      <div class="not-found ion-padding ion-text-center">
        <ion-icon name="alert-circle-outline" class="not-found-icon" color="medium" />
        <h2>Partie introuvable</h2>
        <p>Aucune partie ne correspond à cet identifiant.</p>
        <ion-button (click)="goHome()">Retour à l'accueil</ion-button>
      </div>
    }
  }
</div>
