<div class="home-container ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Accueil</ion-card-title>
      <ion-card-subtitle>Créez une partie ou rejoignez un score existant.</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-button expand="block" [disabled]="isCreating" (click)="createGame()">
        {{ isCreating ? 'Creation en cours...' : 'Creer une partie' }}
      </ion-button>

      @if (createError) {
        <ion-note color="danger">{{ createError }}</ion-note>
      }

      <ion-item class="join-input">
        <ion-input
          label="Code de partie"
          labelPlacement="stacked"
          [(ngModel)]="joinCode"
          placeholder="Ex: abc123"
        />
      </ion-item>

      @if (joinError) {
        <ion-note color="danger">{{ joinError }}</ion-note>
      }

      <ion-button expand="block" fill="outline" (click)="joinGame()">
        Rejoindre une partie
      </ion-button>
    </ion-card-content>
  </ion-card>
</div>
