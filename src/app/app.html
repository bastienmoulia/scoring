<ion-app>
  @if (isGameRoute) {
    <ion-header [translucent]="true">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/home" text="" />
        </ion-buttons>
        <ion-title class="app-title">{{ title }}</ion-title>
      </ion-toolbar>
    </ion-header>
  }

  <ion-content [fullscreen]="true">
    <router-outlet />
  </ion-content>
</ion-app>
